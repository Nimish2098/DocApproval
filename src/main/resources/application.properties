spring.application.name=DocApproval

# Load local secrets from .env (optional: ignored if the file doesn't exist, e.g. on Render)
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database (Postgres)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.datasource.driver-class-name=org.postgresql.Driver

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000

# File upload limits (2 MB resume)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Gemini via Spring AI (temperature 0 for consistent scoring)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.0
spring.ai.google.genai.chat.options.max-output-tokens=8192

# CORS: comma-separated frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging (never log resume text in production)
logging.level.root=INFO
logging.level.com.Project.DocApproval=INFO